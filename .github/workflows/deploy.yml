name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Step 1: Clones your new code (including the /app directory) into the runner workspace
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Launches the Nginx container directly from the runner workspace
      - name: Deploy with Docker Compose
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          docker compose up -d --build --remove-orphans

      # Step 3: Cleans up old image fragments
      - name: Purge Old Images
        run: |
          docker image prune -f
