<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>SproutOps</title>
    <link rel="icon" type="image/png" href="./assets/logo_new.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme:light; --background:#FAFAF8; --surface:#FFFFFF; --surface-secondary:#FCFCFC; --surface-hover:#F5F7F9; --text-primary:#1F2937; --text-secondary:#6B7280; --text-muted:#9CA3AF; --border:#ECECEC; --border-strong:#D6DCE3; --primary:#239CC3; --primary-hover:#1F8BB0; --primary-foreground:#FFFFFF; --danger:#B42318; --input-border:#D9E0E7; --input-focus:#239CC3; --new-video-background:#EAF5FC; --new-video-hover:#DCEEF8; --new-video-text:#1D70A2; --stage-card-background:#F3F0FA; --stage-card-icon:#7666A8; --up-next-card-background:#EDF8F0; --up-next-card-icon:#4D8A5C; --pre-production-header:#F0F8FC; --production-header:#F3FAF2; --editing-header:#F7F3FC; --publishing-header:#FFF7EF; --focus-ring:rgba(35,156,195,.16); --header-background:rgba(250,250,248,.88); --backdrop:rgba(15,23,42,.40); --card-shadow:0 1px 2px rgba(15,23,42,.05); --primary-shadow:0 4px 12px rgba(35,156,195,.18); --modal-shadow:0 12px 40px rgba(15,23,42,.12); --radius-card:18px; --radius-button:12px; --radius-input:12px; --radius-pill:9999px; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
        body { min-height:100vh; padding:0 16px 40px; background:var(--background); color:var(--text-primary); }
        button,input,textarea { font:inherit; } button { -webkit-tap-highlight-color:transparent; }
        :where(button,input,textarea):focus-visible { outline:3px solid var(--focus-ring); outline-offset:2px; }
        .page-shell { max-width:900px; margin:0 auto; }
        .header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px; padding:12px 0; margin-bottom:20px; background:var(--header-background); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
        .brand-row { display:flex; align-items:center; gap:12px; }.brand-logo { width:44px; height:44px; object-fit:contain; }.app-title { font-size:26px; font-weight:700; letter-spacing:-.02em; }.header-copy { margin-top:4px; color:var(--text-secondary); font-size:14px; }
        .header-actions { display:flex; align-items:center; gap:12px; margin-left:auto; }.account-control { display:flex; align-items:center; gap:8px; }.account-email { max-width:220px; overflow:hidden; color:var(--text-secondary); font-size:13px; text-overflow:ellipsis; white-space:nowrap; }.sign-out-btn { min-height:36px; padding:8px 10px; }
        .new-video-btn,.primary-btn,.secondary-btn,.danger-btn { min-height:40px; padding:10px 14px; border-radius:var(--radius-button); font-weight:600; cursor:pointer; }
        .primary-btn { border:0; background:var(--primary); color:var(--primary-foreground); box-shadow:var(--primary-shadow); }.primary-btn:hover { background:var(--primary-hover); }.new-video-btn { background:var(--new-video-background); color:var(--new-video-text); border:0; box-shadow:none; }.new-video-btn:hover { background:var(--new-video-hover); }.header-new-video-btn { margin-left:auto; }
        .secondary-btn { border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary); }.danger-btn { border:1px solid currentColor; background:var(--surface); color:var(--danger); }.new-video-btn:disabled,.primary-btn:disabled { opacity:.6; cursor:wait; }
        .new-video-fab { display:none; position:fixed; right:24px; bottom:24px; z-index:15; width:56px; height:56px; padding:0; border-radius:50%; font-size:30px; }
        .video-list { display:grid; gap:14px; }.video-card-wrap { overflow:hidden; border:1px solid var(--border); border-radius:var(--radius-card); background:var(--surface); box-shadow:var(--card-shadow); }.video-card-wrap:hover { border-color:var(--border-strong); }
        .video-card { width:100%; padding:18px; border:0; background:transparent; color:var(--text-primary); text-align:left; cursor:pointer; }.video-card:hover { background:var(--surface-hover); }.video-card-top { display:flex; align-items:center; justify-content:space-between; gap:14px; }.video-title { font-size:20px; font-weight:700; }.chevron { color:var(--text-muted); font-size:21px; transition:transform 180ms ease; }.video-card[aria-expanded="true"] .chevron { transform:rotate(90deg); }
        .video-facts { display:flex; gap:8px; margin-top:10px; }.fact-card { display:flex; flex:1 1 0; min-width:0; align-items:center; gap:7px; padding:4px 8px; border-radius:var(--radius-input); }.stage-fact { background:var(--stage-card-background); }.up-next-fact { background:var(--up-next-card-background); }.fact-icon { flex:0 0 auto; font-size:15px; line-height:1; }.stage-fact .fact-icon { color:var(--stage-card-icon); }.up-next-fact .fact-icon { color:var(--up-next-card-icon); }.fact-copy { min-width:0; }.fact-label { display:block; color:var(--text-muted); font-size:9px; font-weight:600; line-height:10px; }.fact-value { display:block; overflow:hidden; color:var(--text-primary); font-size:12px; font-weight:600; line-height:14px; text-overflow:ellipsis; white-space:nowrap; }
        .stage-summary { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-top:8px; }.stage-summary-item { min-width:0; color:var(--text-muted); font-size:11px; font-weight:600; }.stage-symbol { font-size:16px; }.stage-state { display:block; overflow:hidden; margin-top:3px; text-overflow:ellipsis; white-space:nowrap; }.stage-summary-item.current { color:var(--primary); }
        .accordion-details { padding:0 18px 18px; }.detail-workflow { display:grid; gap:14px; }.detail-section { padding:20px; border:1px solid var(--border); border-radius:var(--radius-card); background:var(--surface); }.section-heading { display:flex; width:100%; align-items:center; gap:8px; margin:-12px; padding:12px; border:0; border-radius:10px; color:var(--text-primary); font-size:12px; font-weight:600; letter-spacing:.14em; text-align:left; cursor:pointer; }.section-chevron { margin-left:auto; color:var(--text-muted); font-size:18px; transition:transform 180ms ease; }.section-heading[aria-expanded="true"] .section-chevron { transform:rotate(90deg); }.section-content { margin-top:22px; }.stage-pre-production { background:var(--pre-production-header); }.stage-production { background:var(--production-header); }.stage-editing { background:var(--editing-header); }.stage-publishing { background:var(--publishing-header); }.task-row { display:flex; align-items:center; gap:12px; min-height:46px; cursor:pointer; }.task-row + .task-row { border-top:1px solid var(--border); }.task-check { width:18px; height:18px; flex:0 0 auto; accent-color:var(--primary); cursor:pointer; }.task-check:disabled { cursor:wait; opacity:.55; }.task-row.completed .task-label { color:var(--text-secondary); text-decoration:line-through; }.task-label { font-size:15px; font-weight:500; }.section-empty,.task-loading,.task-load-error { color:var(--text-secondary); font-size:14px; }.task-retry { padding:2px 4px; }.task-update-error { margin:-7px 0 7px 30px; color:var(--danger); font-size:12px; }.editing-content { display:grid; gap:10px; margin-top:14px; }.version-card { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-input); background:var(--surface-secondary); }.eyebrow { color:var(--text-muted); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }.version-name { margin-top:3px; font-size:15px; font-weight:700; text-transform:capitalize; }.editing-meta { color:var(--text-muted); font-size:13px; }.detail-panel { display:grid; gap:14px; margin-top:14px; padding:18px; border-top:1px solid var(--border); }.detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }.detail-item { padding:12px; border-radius:var(--radius-input); background:var(--surface-secondary); }.detail-label { color:var(--text-muted); font-size:11px; font-weight:700; text-transform:uppercase; }.detail-value { margin-top:4px; color:var(--text-secondary); font-size:14px; }
        .edit-form { display:grid; gap:10px; }.form-field { display:grid; gap:6px; }.form-field span { color:var(--text-secondary); font-size:12px; font-weight:600; }.form-input { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--input-border); border-radius:var(--radius-input); background:var(--surface); color:var(--text-primary); }.form-input:focus { border-color:var(--input-focus); box-shadow:0 0 0 3px var(--focus-ring); outline:0; }.form-actions { display:flex; justify-content:flex-end; gap:10px; }.inline-error { color:var(--danger); font-size:13px; }
        .auth-notice { margin-bottom:14px; padding:12px 14px; border:1px solid var(--border-strong); border-radius:var(--radius-input); background:var(--surface); color:var(--text-secondary); font-size:14px; text-align:center; }.state-card { padding:28px; border:1px dashed var(--border-strong); border-radius:var(--radius-card); background:var(--surface); color:var(--text-secondary); text-align:center; }.state-card h2 { margin-bottom:8px; color:var(--text-primary); font-size:20px; }.state-card .primary-btn { margin-top:16px; }.skeleton { min-height:160px; overflow:hidden; position:relative; border:1px solid var(--border); border-radius:var(--radius-card); background:var(--surface); }.skeleton::after { position:absolute; inset:0; background:linear-gradient(90deg,transparent,var(--surface-hover),transparent); animation:shimmer 1.2s infinite; content:""; } @keyframes shimmer { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
        .auth-shell { min-height:calc(100vh - 40px); display:grid; place-items:center; padding:24px 0; }.auth-card { width:min(100%,430px); padding:32px; border:1px solid var(--border); border-radius:var(--radius-card); background:var(--surface); box-shadow:var(--modal-shadow); }.auth-logo { display:block; width:58px; height:58px; margin:0 auto 14px; object-fit:contain; }.auth-card h1 { font-size:25px; text-align:center; }.auth-card > p { margin-top:8px; color:var(--text-secondary); line-height:1.6; text-align:center; }.auth-form { display:grid; gap:10px; margin-top:24px; }.auth-form label { color:var(--text-secondary); font-size:13px; font-weight:600; }.auth-form .primary-btn { margin-top:4px; }.auth-message { margin-top:14px; color:var(--text-secondary); font-size:13px; line-height:1.5; text-align:center; }.auth-error { color:var(--danger); }.auth-secondary-actions { display:grid; gap:8px; margin-top:16px; }.auth-secondary-actions .secondary-btn:disabled { opacity:.55; cursor:not-allowed; }.text-btn { padding:8px; border:0; background:transparent; color:var(--new-video-text); font-weight:600; cursor:pointer; }.auth-loading { color:var(--text-secondary); text-align:center; }.auth-loading p { margin-top:8px; }
        .modal-backdrop { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:16px; background:var(--backdrop); }.modal-card { width:min(100%,480px); padding:20px; border-radius:var(--radius-card); background:var(--surface); box-shadow:var(--modal-shadow); }.modal-header { display:flex; justify-content:space-between; gap:12px; margin-bottom:16px; }.modal-title { font-size:20px; }.modal-copy { margin-top:5px; color:var(--text-secondary); font-size:14px; }.modal-close { width:36px; height:36px; border:0; border-radius:50%; background:var(--surface-hover); cursor:pointer; }.modal-form { display:grid; gap:12px; }.modal-actions { display:flex; justify-content:flex-end; gap:10px; }
        @media (max-width:640px) { body { padding:0 12px 96px; }.brand-logo { width:40px; height:40px; }.app-title { font-size:23px; }.header-copy { display:none; }.header-new-video-btn { display:none; }.new-video-fab { display:inline-grid; place-items:center; }.account-email { display:none; }.sign-out-btn { font-size:12px; }.video-card { padding:16px; }.video-title { font-size:17px; }.stage-state { display:none; }.detail-grid { grid-template-columns:1fr; }.form-actions { flex-direction:column-reverse; }.modal-backdrop { align-items:end; padding:0; }.modal-card { width:100%; border-radius:24px 24px 0 0; }.auth-card { padding:24px 20px; } }
    </style>
</head>

    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>

</html>
