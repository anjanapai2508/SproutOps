<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SproutOps</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            padding:40px 20px;
        }

        .container{
            width:100%;
            max-width:700px;
        }

        .header{
            margin-bottom:30px;
        }

        h1{
            font-size:2rem;
            color:#1e293b;
        }

        p{
            color:#64748b;
            margin-top:6px;
        }

        .progress-card,
        .task-card{
            background:white;
            border-radius:18px;
            padding:20px;
            box-shadow:0 8px 30px rgba(0,0,0,.05);
            margin-bottom:18px;
        }

        .progress{
            height:12px;
            background:#e5e7eb;
            border-radius:100px;
            overflow:hidden;
            margin-top:15px;
        }

        .progress-fill{
            width:57%;
            height:100%;
            background:#3b82f6;
        }

        .task{
            display:flex;
            align-items:center;
            padding:16px 0;
            border-bottom:1px solid #f1f5f9;
        }

        .task:last-child{
            border:none;
        }

        input{
            width:22px;
            height:22px;
            margin-right:15px;
        }

        .task-text{
            flex:1;
        }

        .task-title{
            font-weight:600;
            color:#0f172a;
        }

        .task-sub{
            font-size:.85rem;
            color:#64748b;
            margin-top:3px;
        }

        .badge{
            padding:6px 10px;
            border-radius:999px;
            font-size:.75rem;
            font-weight:600;
        }

        .ready{
            background:#dbeafe;
            color:#2563eb;
        }

        .waiting{
            background:#fef3c7;
            color:#92400e;
        }

        .done{
            background:#dcfce7;
            color:#15803d;
        }

        @media(max-width:600px){

            body{
                padding:18px;
            }

            h1{
                font-size:1.6rem;
            }

            .progress-card,
            .task-card{
                border-radius:14px;
                padding:18px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌱 SproutOps</h1>
        <p>Simple production tracking</p>
    </div>

    <div class="progress-card">

        <strong>Today's Progress</strong>

        <p>8 / 14 Tasks Complete</p>

        <div class="progress">
            <div class="progress-fill"></div>
        </div>

    </div>

    <div class="task-card">

        <div class="task">
            <input type="checkbox">
            <div class="task-text">
                <div class="task-title">Script Complete</div>
                <div class="task-sub">Updated 10 mins ago</div>
            </div>
            <span class="badge done">DONE</span>
        </div>

        <div class="task">
            <input type="checkbox">
            <div class="task-text">
                <div class="task-title">Producer Review</div>
                <div class="task-sub">Waiting for review</div>
            </div>
            <span class="badge ready">READY</span>
        </div>

        <div class="task">
            <input type="checkbox">
            <div class="task-text">
                <div class="task-title">Actor Recording</div>
                <div class="task-sub">Starts today</div>
            </div>
            <span class="badge waiting">WAITING</span>
        </div>

        <div class="task">
            <input type="checkbox">
            <div class="task-text">
                <div class="task-title">Edit Video</div>
                <div class="task-sub">Pending</div>
            </div>
            <span class="badge waiting">WAITING</span>
        </div>

        <div class="task">
            <input type="checkbox">
            <div class="task-text">
                <div class="task-title">Thumbnail</div>
                <div class="task-sub">Pending</div>
            </div>
            <span class="badge waiting">WAITING</span>
        </div>

    </div>

</div>

</body>
</html>
